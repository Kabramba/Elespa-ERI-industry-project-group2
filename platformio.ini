; PlatformIO project for the ESP32-S3 <-> JBD BMS telemetry bridge.
;
;   pio run                    build for the board
;   pio run -t upload          flash it
;   pio device monitor         serial monitor
;   pio test -e native         run the decode + ring tests on THIS machine
;   pio run -t compiledb       emit compile_commands.json for clangd

[platformio]
; What the VS Code Build/Upload buttons target when no environment is chosen.
;
; Deliberately the Activa application, not the JBD one. An accidental Upload
; while plugged into the vehicle DLC must not flash firmware that transmits
; remote frames at 0x100-0x110 onto an engine ECU bus - those are outside the
; allowlist in docs/activa-can.md. The Activa app can only emit allowlisted
; read requests, so a mis-click is harmless in the direction that matters.
;
; Switch back with the environment picker in the PlatformIO sidebar, or
;   pio run -e esp32s3 -t upload
default_envs = esp32s3_activa_obd

; Compiler flags every environment shares. Kept in its own section so each
; environment can append its own defines without redefining an inherited
; macro - the preprocessor warns about that, and -U cannot fix it here
; because PlatformIO joins continuation lines in a way that mangles a bare -U.
[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include

[env:esp32s3]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino

; The CH343 bridge sits on UART0, not the native USB port, so Serial goes to
; the bridge with no CDC-on-boot juggling. See reference/safe-save-copy-esp32/.
;
; Addressed by its USB descriptor, not /dev/ttyACMn. The kernel hands out those
; numbers in plug order, so a replug can move the board from ACM0 to ACM1 and
; silently break upload and monitor - which is exactly what happened. The by-id
; symlink follows the device instead.
;
; It must be an EXACT path, not a glob: PlatformIO matches wildcards against the
; ports it discovers (/dev/ttyACMn), so a by-id pattern never matches anything.
; 5B5E083130 is this board's USB serial number - a different board needs its own
; symlink here, which `ls /dev/serial/by-id/` will show.
upload_port   = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B5E083130-if00
monitor_port  = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B5E083130-if00
monitor_speed = 115200
upload_speed  = 921600

board_build.flash_mode = dio
board_upload.flash_size = 16MB
; The board definition only ships as the N8 variant; this module is an N16R8.
; default_16MB.csv gives two 6.5 MB app partitions instead of 1.25 MB, so there
; is room for every profile plus OTA rather than trimming to fit.
board_build.partitions = default_16MB.csv

build_src_filter = +<*> -<apps/> +<apps/main_jbd.cpp>

build_unflags = -std=gnu++11 -std=gnu++14
; Packets go out in the text-safe hex form for every application that prints
; human-readable diagnostics on the USB port - all of them except the
; self-test. Binary COBS frames would be shredded by the interleaved text.
; Override to TELEMETRY_OUT_UART1_COBS for the dedicated link, which is the
; real deliverable.
build_flags = ${common.build_flags} -D TELEMETRY_OUTPUT=TELEMETRY_OUT_USB_HEX

; -------------------------------------------------------------------------
; Honda Activa bitrate probe. LISTEN ONLY - never transmits, never ACKs.
; Flash this BEFORE connecting to the vehicle DLC: the JBD application starts
; transmitting remote frames the moment it boots, which must not happen on a
; vehicle bus.
; -------------------------------------------------------------------------
[env:esp32s3_activa_probe]
extends          = env:esp32s3
build_src_filter = +<*> -<apps/> +<apps/main_activa_probe.cpp>

; -------------------------------------------------------------------------
; Honda Activa OBD-II requester. TRANSMITS - read-only services only, every
; frame gated by can::mayTransmitId() and obd::isPermittedRequestFrame().
; Scooter stationary, engine off.
; -------------------------------------------------------------------------
[env:esp32s3_activa_obd]
extends          = env:esp32s3
build_src_filter = +<*> -<apps/> +<apps/main_activa_obd.cpp>

; Same board with CAN single-shot instead of hardware retransmission. Pick it
; from the environment switcher in the VS Code status bar to flip modes without
; editing source.
;
; Single shot is the DIAGNOSTIC mode: it reports the fate of every individual
; frame via TWAI_ALERT_TX_FAILED, which the controller hides once it is
; retransmitting. Use it to find out why a bus is unhappy; use the default to
; actually move data. See app_config.h for everything the toggle changes.
[env:esp32s3_canss]
extends          = env:esp32s3
build_src_filter = ${env:esp32s3.build_src_filter}
build_flags      = ${env:esp32s3.build_flags} -D JBD_CAN_HARDWARE_RETRANSMIT=0

; -------------------------------------------------------------------------
; The packet pipeline with NOTHING attached to the board. Publishes only
; simulated packets - every one carries kFlagSimulated - and never brings a CAN
; controller up, so it is safe whatever the board is plugged into.
;
; The only environment that puts BINARY COBS frames on the USB port, so it
; prints no text at all. Read it with:
;     tools/telemetry_decode.py /dev/ttyACM0
; -------------------------------------------------------------------------
[env:esp32s3_selftest]
extends          = env:esp32s3
build_src_filter = +<*> -<apps/> +<apps/main_telemetry_selftest.cpp>
build_flags      = ${common.build_flags} -D TELEMETRY_OUTPUT=TELEMETRY_OUT_USB_COBS

[env:native]
platform      = native
test_framework = unity
; Tests do not compile src/ unless asked; build_src_filter then narrows it to
; the Arduino-free translation units.
test_build_src = yes
build_src_filter = +<jbd_protocol.cpp> +<bms_types.cpp> +<status_led.cpp>
                   +<can/can_timing.cpp> +<can/can_bus_profile.cpp>
                   +<can/can_profile_registry.cpp> +<can/active_profile.cpp>
                   +<obd/obd_isotp.cpp> +<obd/vehicle_types.cpp>
                   +<crc16.cpp> +<telemetry/stat_block.cpp> +<telemetry/packet.cpp>
                   +<telemetry/framing.cpp> +<telemetry/publisher.cpp>
                   +<telemetry/mappers.cpp>
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include
