; PlatformIO project for the ESP32-S3 <-> JBD BMS telemetry bridge.
;
;   pio run                    build for the board
;   pio run -t upload          flash it
;   pio device monitor         serial monitor
;   pio test -e native         run the decode + ring tests on THIS machine
;   pio run -t compiledb       emit compile_commands.json for clangd

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino

; The CH343 bridge sits on UART0, not the native USB port, so Serial goes to
; the bridge with no CDC-on-boot juggling. See safe-save-copy-esp32/README.md.
upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0
monitor_speed = 115200
upload_speed  = 921600

board_build.flash_mode = dio
board_upload.flash_size = 16MB

build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include

; Same board with CAN single-shot instead of hardware retransmission. Pick it
; from the environment switcher in the VS Code status bar to flip modes without
; editing source.
;
; Single shot is the DIAGNOSTIC mode: it reports the fate of every individual
; frame via TWAI_ALERT_TX_FAILED, which the controller hides once it is
; retransmitting. Use it to find out why a bus is unhappy; use the default to
; actually move data. See app_config.h for everything the toggle changes.
[env:esp32s3_canss]
extends     = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -D JBD_CAN_HARDWARE_RETRANSMIT=0

[env:native]
platform      = native
test_framework = unity
; Tests do not compile src/ unless asked; build_src_filter then narrows it to
; the Arduino-free translation units.
test_build_src = yes
build_src_filter = +<jbd_protocol.cpp> +<bms_types.cpp> +<status_led.cpp>
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include
