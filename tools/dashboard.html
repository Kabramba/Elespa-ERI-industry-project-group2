<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activa ECU</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d2129; --line:#272d3a;
    --fg:#e6e8ec; --dim:#8b93a7; --accent:#4da3ff;
    --good:#3ddc84; --warn:#ffb648; --bad:#ff5f56;
    --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
         padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);
       box-shadow:0 0 0 3px rgba(255,95,86,.15);transition:.2s}
  .dot.live{background:var(--good);box-shadow:0 0 0 3px rgba(61,220,132,.15)}
  .ident{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto;
         font-family:var(--mono);font-size:12px;color:var(--dim)}
  .ident b{color:var(--fg);font-weight:600}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
         border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{border-color:var(--warn);color:var(--warn)}

  #banner{display:none;padding:10px 18px;background:rgba(255,182,72,.1);
          border-bottom:1px solid var(--warn);color:var(--warn);font-size:13px}
  #banner.show{display:block}

  main{padding:16px 18px 0}
  #cards{display:grid;gap:12px;
         grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
        padding:11px 13px;transition:opacity .3s}
  .card.stale{opacity:.42}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .card .nm{font-size:12px;color:var(--dim);letter-spacing:.3px}
  .card .pid{font-family:var(--mono);font-size:10px;color:var(--line);
             background:var(--panel2);padding:1px 5px;border-radius:4px;color:var(--dim)}
  .card .val{font-family:var(--mono);font-size:27px;font-weight:600;
             margin-top:4px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .card .u{font-size:12px;color:var(--dim);margin-left:4px;font-weight:400}
  .card .d{font-family:var(--mono);font-size:11px;color:var(--dim);
           font-variant-numeric:tabular-nums}
  .card .d.up{color:var(--good)} .card .d.dn{color:var(--accent)}
  canvas{display:block;width:100%;height:42px;margin-top:6px}

  #rawwrap{margin:16px 0 0;background:var(--panel);border:1px solid var(--line);
           border-radius:9px;overflow:hidden}
  #rawhead{display:flex;align-items:center;gap:10px;padding:8px 13px;
           border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
  #raw{height:230px;overflow-y:auto;padding:9px 13px;margin:0;
       font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--dim)}
  #raw div.t{color:var(--accent)} #raw div.r{color:var(--good)}
  #raw div.m{color:var(--warn)}   #raw div.e{color:var(--bad)}

  footer{position:sticky;bottom:0;margin-top:14px;padding:9px 18px;
         background:var(--panel);border-top:1px solid var(--line);
         font-family:var(--mono);font-size:11.5px;color:var(--dim);
         display:flex;gap:20px;flex-wrap:wrap}
  footer b{color:var(--fg);font-weight:600}
  .empty{color:var(--dim);padding:26px 0;text-align:center;font-size:13px}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <h1>Activa ECU</h1>
  <button id="btnreset">reset charts</button>
  <button id="btnpause">pause raw</button>
  <button id="btnrelease" title="Let go of the serial port so you can reflash">release port</button>
  <div class="ident">
    <span>VIN <b id="vin">—</b></span>
    <span>ECU <b id="ecu">—</b></span>
    <span>link <b id="link">—</b></span>
    <span>DTC <b id="dtc">—</b></span>
  </div>
</header>

<div id="banner"></div>

<main>
  <div id="cards"><div class="empty">waiting for frames…</div></div>

  <div id="rawwrap">
    <div id="rawhead"><span>raw serial</span><span id="rawnote"></span></div>
    <div id="raw"></div>
  </div>
</main>

<footer>
  <span>port <b id="port">—</b></span>
  <span>rx <b id="rx">0</b></span>
  <span>tx <b id="tx">0</b></span>
  <span><b id="rate">0</b> frame/s</span>
  <span>parse errors <b id="errs">0</b></span>
  <span id="undec"></span>
</footer>

<script>
const $ = id => document.getElementById(id);
let paused = false, charts = new Map();

$("btnpause").onclick = () => {
  paused = !paused;
  $("btnpause").classList.toggle("on", paused);
  $("btnpause").textContent = paused ? "resume raw" : "pause raw";
};
$("btnreset").onclick = () => fetch("/api/reset", {method:"POST"});
$("btnrelease").onclick = () => fetch("/api/release?seconds=25", {method:"POST"});

// Small hand-drawn line chart. No chart library: this has to work in a garage
// with no internet, so nothing is loaded from a CDN.
function drawChart(cv, data){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w*dpr || cv.height !== h*dpr){ cv.width = w*dpr; cv.height = h*dpr; }
  const c = cv.getContext("2d");
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,w,h);
  if (!data || data.length < 2) return;

  let lo = Math.min(...data), hi = Math.max(...data);
  if (hi - lo < 1e-9){ lo -= 1; hi += 1; }          // flat line sits centred
  const pad = 3, span = hi - lo;
  const x = i => (i/(data.length-1))*w;
  const y = v => pad + (1-(v-lo)/span)*(h-2*pad);

  const g = c.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"rgba(77,163,255,.22)"); g.addColorStop(1,"rgba(77,163,255,0)");
  c.beginPath(); c.moveTo(x(0), y(data[0]));
  for (let i=1;i<data.length;i++) c.lineTo(x(i), y(data[i]));
  c.lineTo(w,h); c.lineTo(0,h); c.closePath(); c.fillStyle=g; c.fill();

  c.beginPath(); c.moveTo(x(0), y(data[0]));
  for (let i=1;i<data.length;i++) c.lineTo(x(i), y(data[i]));
  c.strokeStyle="#4da3ff"; c.lineWidth=1.6; c.lineJoin="round"; c.stroke();
}

function upsertCard(v){
  let el = charts.get(v.pid);
  if (!el){
    const empty = $("cards").querySelector(".empty");
    if (empty) empty.remove();
    el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<div class="top"><span class="nm"></span><span class="pid"></span></div>
                    <div class="val"><span class="n"></span><span class="u"></span></div>
                    <div class="d"></div><canvas></canvas>`;
    el.querySelector(".nm").textContent  = v.name;
    el.querySelector(".pid").textContent = v.pid;
    $("cards").appendChild(el);
    charts.set(v.pid, el);
  }
  el.querySelector(".n").textContent = v.value.toFixed(1);
  el.querySelector(".u").textContent = v.unit;
  const d = el.querySelector(".d");
  if (v.delta === null){ d.textContent = "—"; d.className = "d"; }
  else {
    d.textContent = (v.delta>=0?"▲ +":"▼ ") + v.delta.toFixed(1) + " /s";
    d.className = "d " + (Math.abs(v.delta)<0.05 ? "" : v.delta>0 ? "up":"dn");
  }
  el.classList.toggle("stale", v.age > 3);
  drawChart(el.querySelector("canvas"), v.history);
}

function addRaw(lines){
  if (paused || !lines.length) return;
  const box = $("raw");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  for (const ln of lines){
    const d = document.createElement("div");
    d.textContent = ln;
    d.className = ln.startsWith("T ") ? "t" : ln.startsWith("R ") ? "r"
                : ln.startsWith("!!") ? "e" : ln.startsWith("#") ? "m" : "";
    box.appendChild(d);
  }
  while (box.childElementCount > 600) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function connect(){
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = ev => {
    const s = JSON.parse(ev.data);
    $("dot").classList.toggle("live", s.connected && s.ok);
    $("port").textContent = s.port || "—";
    $("vin").textContent  = s.meta.VIN || "—";
    $("ecu").textContent  = (s.meta.ECU || "—").trim();
    $("link").textContent = s.meta.LINK || "—";
    $("dtc").textContent  = s.meta.DTC || "—";
    $("rx").textContent = s.stats.rx; $("tx").textContent = s.stats.tx;
    $("rate").textContent = s.stats.rate; $("errs").textContent = s.stats.errors;
    $("undec").textContent = s.undecoded.length
        ? "no scaling: " + s.undecoded.join(" ") : "";

    const b = $("banner");
    if (s.released > 0) { b.className="show";
        b.textContent = `⏏ port released for ${s.released.toFixed(0)}s — flash now, `
                      + `the dashboard reconnects on its own`; }
    else if (s.error)   { b.className="show"; b.textContent = "⚠ " + s.error; }
    else if (!s.connected){ b.className="show"; b.textContent = "⚠ serial not connected — retrying…"; }
    else if (!s.ok)     { b.className="show";
        b.textContent = s.mode
          ? `⚠ wrong firmware mode: "${s.mode}" — expected activa-obd`
          : "⚠ waiting for '# MODE activa-obd' — flash env:esp32s3_activa_obd"; }
    else b.className = "";

    for (const v of s.values) upsertCard(v);
    addRaw(s.raw || []);
    $("rawnote").textContent = paused ? "(paused)" : "";
  };
  ws.onclose = () => { $("dot").classList.remove("live"); setTimeout(connect, 1200); };
}
connect();
window.addEventListener("resize", () => {
  for (const [pid, el] of charts) drawChart(el.querySelector("canvas"), []);
});
</script>
</body>
</html>
